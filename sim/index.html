<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1430">
<title>そらのみなと ～ドット空港経営記～</title>
<style>
:root{
  --ink:#2b2134;--ink2:#4a3f58;--paper:#fff8e7;--paper2:#f3e6c8;--paper3:#e8d6ae;--blue:#3a7bd5;--blue2:#2a5aa8;--sky:#bfe0ff;
  --orange:#ff9f43;--good:#3fae5a;--bad:#e5484d;--gold:#e8b830;--pink:#f59ac0;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1430;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Meiryo","Yu Gothic",sans-serif;touch-action:none;overscroll-behavior:none;font-weight:700}
canvas#game{position:fixed;inset:0;display:block;touch-action:none;outline:none;image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;font-weight:800}
img.pxi{image-rendering:pixelated;width:24px;height:24px;vertical-align:middle;flex:none}
img.pxi.s{width:18px;height:18px}
img.pxi.l{width:36px;height:36px}
img.pxi.xl{width:48px;height:48px}

/* ---- ピクセル風の窓 ---- */
.px{background:var(--paper);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #fff,inset 0 -4px 0 2px var(--paper2),4px 5px 0 rgba(20,10,30,.35);border-radius:6px}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 12px;border:3px solid var(--ink);border-radius:6px;
  background:linear-gradient(#fffdf6,#f1e2bf);box-shadow:inset 0 -3px 0 #d8c08e,0 3px 0 var(--ink);font-size:15px;line-height:1.15;position:relative;top:0;transition:filter .1s}
.pbtn:active{top:3px;box-shadow:inset 0 -1px 0 #d8c08e,0 0 0 var(--ink)}
.pbtn:hover{filter:brightness(1.05)}
.pbtn.blue{background:linear-gradient(#6aa6f0,#3a7bd5);color:#fff;box-shadow:inset 0 -3px 0 #2a5aa8,0 3px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pbtn.green{background:linear-gradient(#7ad88a,#3fae5a);color:#fff;box-shadow:inset 0 -3px 0 #2a8a44,0 3px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pbtn.red{background:linear-gradient(#f57a7d,#e5484d);color:#fff;box-shadow:inset 0 -3px 0 #b02a30,0 3px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pbtn.gold{background:linear-gradient(#ffe27a,#f0b830);box-shadow:inset 0 -3px 0 #c08a10,0 3px 0 var(--ink)}
.pbtn[disabled]{filter:grayscale(.85) opacity(.6);cursor:not-allowed}
.pbtn.on{background:linear-gradient(#ffe27a,#f0b830);box-shadow:inset 0 -3px 0 #c08a10,0 3px 0 var(--ink)}
.pbtn.sm{min-height:32px;padding:3px 9px;font-size:13px}
.pbtn.wide{width:100%}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{outline:3px solid rgba(255,216,74,0);outline-offset:0}50%{outline:4px solid #ffd84a;outline-offset:3px}}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));top:calc(8px + var(--safe-t));display:flex;gap:8px;align-items:stretch;pointer-events:none}
#topbar>*{pointer-events:auto}
.tb{display:flex;align-items:center;gap:8px;padding:5px 10px;min-height:46px}
#tbName{flex:0 1 auto;min-width:0}
#tbName .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
#tbName .rk{font-size:11px;color:var(--blue2)}
.stars{color:#f0b830;font-size:15px;letter-spacing:-1px;text-shadow:0 1px 0 var(--ink)}
.rankb{background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:1px 6px;font-size:12px}
#tbDate{flex:1 1 auto;justify-content:center;min-width:0}
#tbDate .d{font-size:13px;white-space:nowrap}
#tbDate .t{font-size:22px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
#tbMoney{flex:0 0 auto}
#tbMoney .m{font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace;min-width:120px;text-align:right}
#tbMoney .m.neg{color:var(--bad)}
.spd{display:flex;gap:3px}
.spd button{width:34px;height:32px;border:2px solid var(--ink);border-radius:4px;background:#fffdf6;font-size:12px;padding:0}
.spd button.on{background:#ffd84a}
#mission{position:absolute;left:calc(8px + var(--safe-l));top:calc(66px + var(--safe-t));width:min(290px,48vw);padding:8px 10px;font-size:12.5px;line-height:1.45}
#mission h4{margin:0 0 4px;font-size:12px;color:var(--blue2);display:flex;align-items:center;gap:5px}
#mission .ob{display:flex;gap:6px;align-items:flex-start}
#mission .ob .cb{flex:none;width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;margin-top:2px;background:#fff}
#mission .ob.done{color:#8a8a8a;text-decoration:line-through}
#mission .ob.done .cb{background:var(--good)}
#mission.min .obs{display:none}
#toasts{position:absolute;left:calc(8px + var(--safe-l));bottom:calc(90px + var(--safe-b));display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;max-width:min(380px,70vw)}
.toast{padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center;animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast.good{background:#eaffea}.toast.bad{background:#ffe8e8}.toast.gold{background:#fff4c8}
.toast.out{opacity:0;transform:translateX(-20px)}
@keyframes tin{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
#side{position:absolute;right:calc(8px + var(--safe-r));top:calc(66px + var(--safe-t));display:flex;flex-direction:column;gap:6px}
#side .pbtn{width:44px;height:44px;min-height:0;padding:0}
#toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--safe-b));display:flex;gap:5px;padding:6px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#toolbar .tbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;padding:4px 2px 3px;border:3px solid var(--ink);border-radius:6px;background:linear-gradient(#fffdf6,#f1e2bf);box-shadow:inset 0 -3px 0 #d8c08e;font-size:11px;position:relative}
#toolbar .tbtn:active{transform:translateY(2px)}
#toolbar .tbtn.on{background:linear-gradient(#ffe27a,#f0b830)}
#toolbar .tbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:10px;min-width:18px;padding:0 3px}
/* 建設パネル */
#buildPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safe-b));width:min(920px,calc(100vw - 16px));padding:6px}
#bTabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
#bTabs::-webkit-scrollbar{display:none}
#bTabs button{flex:none;display:flex;align-items:center;gap:4px;padding:4px 9px;border:2px solid var(--ink);border-radius:5px;background:#fffdf6;font-size:12.5px}
#bTabs button.on{background:var(--blue);color:#fff}
#bCards{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.bcard{flex:none;width:112px;border:3px solid var(--ink);border-radius:6px;background:#fffdf6;padding:4px;text-align:center;position:relative;font-size:11.5px;line-height:1.25}
.bcard .th{width:96px;height:72px;margin:0 auto 2px;display:block;image-rendering:pixelated;background:var(--sky);border:2px solid var(--ink2);border-radius:4px}
.bcard .nm{font-size:12px;height:30px;display:flex;align-items:center;justify-content:center}
.bcard .pr{color:var(--blue2)}
.bcard.lock{opacity:.55}
.bcard.lock .lk{position:absolute;left:4px;right:4px;top:4px;height:76px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(40,30,50,.45);color:#fff;font-size:12px;border-radius:3px;text-shadow:0 1px 0 #000}
.bcard.on{background:#fff2b0;outline:3px solid var(--gold)}
.bcard.cant .pr{color:var(--bad)}
.bcard .new{position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:4px;font-size:10px;padding:0 4px}
#buildBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(66px + var(--safe-t));display:flex;gap:6px;align-items:center;padding:6px 10px;font-size:13px;max-width:calc(100vw - 16px)}
#buildBar .msg{max-width:300px}
#buildBar .err{color:var(--bad)}
/* 情報パネル */
#info{position:absolute;right:calc(60px + var(--safe-r));top:calc(66px + var(--safe-t));width:min(320px,calc(100vw - 80px));max-height:calc(100vh - 170px);overflow-y:auto;padding:10px;font-size:13px;line-height:1.5}
#info h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:6px}
#info .x{position:absolute;right:6px;top:6px;width:30px;height:30px;min-height:0;padding:0}
#info .row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--paper3);padding:2px 0}
#info .row b{color:var(--ink2);font-weight:700}
#info .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#info .warn{background:#ffe8e8;border:2px solid var(--bad);border-radius:4px;padding:4px 6px;margin:4px 0;color:#a02030}
#info .combo{background:#fff4c8;border:2px solid var(--gold);border-radius:4px;padding:3px 6px;margin:3px 0}
.bar{height:12px;border:2px solid var(--ink);border-radius:3px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}
#popups{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-size:13px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);font-family:ui-monospace,Menlo,monospace;transform:translate(-50%,-50%);animation:popup 1.2s ease-out forwards;white-space:nowrap}
.pop.gold{color:#ffe060}
@keyframes popup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-34px}}
.lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;padding:4px 8px;font-size:12px;white-space:nowrap;text-align:center;cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#tip{position:absolute;pointer-events:none;padding:4px 8px;font-size:12px;z-index:9;white-space:nowrap}

/* ---- モーダル ---- */
#modal{position:fixed;inset:0;z-index:52;display:flex;align-items:center;justify-content:center;background:rgba(12,10,30,.5);padding:calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
#modal .win{width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#modal .win.narrow{width:min(520px,100%)}
.whead{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--blue);color:#fff;border-bottom:3px solid var(--ink);font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.whead .t{flex:1}
.whead button{width:34px;height:34px;min-height:0;padding:0;color:var(--ink);text-shadow:none}
.whead,.wtabs{flex:none}
.wbody{padding:10px 12px;overflow-y:auto;font-size:13.5px;line-height:1.55;-webkit-overflow-scrolling:touch}
.wtabs{display:flex;gap:4px;padding:6px 8px 0;background:var(--paper2);border-bottom:3px solid var(--ink);overflow-x:auto}
.wtabs button{flex:none;padding:6px 12px;border:3px solid var(--ink);border-bottom:none;border-radius:6px 6px 0 0;background:#e8d6ae;font-size:13px;margin-bottom:-3px}
.wtabs button.on{background:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.card{border:3px solid var(--ink);border-radius:6px;background:#fffdf6;padding:8px;position:relative;font-size:12.5px;line-height:1.45}
.card h5{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:6px}
.card.done{background:#eaffea}
.card.lock{opacity:.6}
.card .meta{color:var(--ink2);font-size:11.5px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:6px;background:#fffdf6;padding:6px 8px}
.li .grow{flex:1;min-width:0}
.li.lock{opacity:.55}
.li.sel{background:#fff2b0}
.sub{color:var(--ink2);font-size:11.5px;font-weight:600}
.tag{display:inline-block;padding:0 6px;border:2px solid var(--ink);border-radius:4px;font-size:11px;background:#fff;margin-right:3px}
.tag.dom{background:#d8f0ff}.tag.asia{background:#ffe8c8}.tag.long{background:#f0d8ff}.tag.space{background:#1a1a3a;color:#fff}
table.fb{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#1a1a22;color:#ffd84a;border:3px solid var(--ink)}
table.fb th{color:#fff;background:#2a2a36;text-align:left;padding:4px 6px;font-family:inherit}
table.fb td{padding:3px 6px;border-top:1px solid #333}
table.fb td.st-ok{color:#80ff80}.fb td.st-bad{color:#ff7070}.fb td.st-now{color:#80d0ff}
.chart{width:100%;height:150px;border:3px solid var(--ink);border-radius:6px;background:#fffdf6;image-rendering:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.kv .k{color:var(--ink2)}
.kv .v{text-align:right;font-family:ui-monospace,Menlo,monospace}
.sec{margin:10px 0 6px;font-size:14px;color:var(--blue2);display:flex;align-items:center;gap:6px;border-bottom:3px dotted var(--paper3);padding-bottom:2px}
.slider{width:100%}
input[type=range]{accent-color:var(--blue)}
input[type=text]{font-family:inherit;font-size:16px;padding:8px;border:3px solid var(--ink);border-radius:6px;width:100%;user-select:text;-webkit-user-select:text;font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:6px;border:3px solid var(--ink);border-radius:6px;background:#fffdf6;font-size:13px}
.seg button.on{background:#ffd84a}
.stamp{width:84px;height:84px;border:3px dashed var(--ink2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;text-align:center;line-height:1.2;transform:rotate(-8deg);background:#fff}
.stamp.got{border-style:solid;border-color:#c02838;color:#c02838;background:#fff4f4}
.stamps{display:flex;flex-wrap:wrap;gap:10px}
.sprite{width:48px;height:60px;image-rendering:pixelated;background-repeat:no-repeat}

/* ---- 会話 ---- */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(760px,calc(100vw - 16px));z-index:40;display:flex;gap:10px;padding:10px;cursor:pointer;align-items:flex-start}
#dialog .por{flex:none;width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:6px;background:#fff}
#dialog .who{font-size:13px;color:#fff;background:var(--blue);display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:4px;margin-bottom:4px}
#dialog .txt{font-size:16px;line-height:1.6;min-height:52px;white-space:pre-wrap}
#dialog .nx{position:absolute;right:12px;bottom:8px;animation:bob 0.8s infinite;font-size:14px}
@keyframes bob{50%{transform:translateY(3px)}}
#dialog .choices{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* ---- タイトル ---- */
#title{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(rgba(10,20,50,.0),rgba(10,20,50,.35))}
#title .box{width:min(460px,100%);text-align:center;padding:18px 18px 14px}
#title .logo{font-size:clamp(30px,8vw,46px);line-height:1.1;color:#fff;text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -4px 0 var(--ink),-4px -4px 0 var(--ink),0 8px 0 rgba(0,0,0,.3);margin:4px 0 2px;letter-spacing:2px}
#title .logo2{font-size:15px;color:#fff;background:var(--blue);display:inline-block;padding:2px 12px;border:3px solid var(--ink);border-radius:6px;margin-bottom:14px}
#title .btns{display:flex;flex-direction:column;gap:9px}
#title .btns .pbtn{min-height:50px;font-size:17px}
#title .ver{font-size:11px;color:#fff;margin-top:10px;text-shadow:0 1px 0 #000}
#loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0c1430;color:#fff;font-size:18px;flex-direction:column;gap:10px}
#loading .lb{width:220px;height:16px;border:3px solid #fff;border-radius:4px;overflow:hidden}
#loading .lb i{display:block;height:100%;width:0;background:#ffd84a;transition:width .2s}
#flash{position:fixed;inset:0;background:#fff;z-index:45;pointer-events:none;opacity:0;transition:opacity .5s}
#credits{position:fixed;inset:0;z-index:55;background:rgba(5,8,25,.82);color:#fff;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#credits .roll{text-align:center;font-size:18px;line-height:2.1;animation:roll 40s linear forwards;padding-top:100vh}
#credits h2{font-size:30px;color:#ffd84a;margin:30px 0 10px}
@keyframes roll{to{transform:translateY(-100%)}}

@media (max-width:720px){
  #tbName .nm{max-width:110px}
  #tbDate .t{font-size:18px}
  #tbMoney .m{font-size:15px;min-width:90px}
  #toolbar .tbtn{width:52px;font-size:10px}
  .bcard{width:96px}.bcard .th{width:82px;height:62px}
  #mission{font-size:11.5px}
  #info{top:auto;bottom:calc(86px + var(--safe-b));right:8px;max-height:45vh}
}
@media (max-width:520px){
  #tbName{display:none}
  #mission{width:62vw}
  .bcard.lock .lk{height:66px}
  .tb{padding:3px 6px;gap:4px}
  #tbName .stars{display:none}
  .spd button{width:28px}
  #tbDate .d{font-size:11px}
}
#tConfirm{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;padding:6px;z-index:6}
#tConfirm .pbtn{min-height:44px;font-size:15px}
#bNight{white-space:nowrap}
.guideMark{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:#3a7bd5;color:#fff;border:3px solid var(--ink);border-radius:6px;padding:3px 8px;font-size:13px;white-space:nowrap;animation:bob .8s infinite}
#mission .ob.cur{background:#fff2b0;border-radius:4px;padding:2px 3px;margin:0 -3px}
#mission .gbtn{margin:4px 0 2px;display:flex;gap:6px;flex-wrap:wrap}

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="labels"></div>
  <div id="popups"></div>
  <div id="topbar">
    <div id="tbName" class="tb px"><div><div class="nm" id="apName"></div><div class="rk"><span class="rankb" id="rankB">Lv1</span> <span id="rankN"></span></div></div><div class="stars" id="stars"></div></div>
    <div id="tbDate" class="tb px"><img class="pxi" id="wxIcon" alt=""><div><div class="d" id="dateTxt"></div><div class="t" id="clock">07:00</div></div><button class="pbtn sm hidden" id="bNight" title="朝までスキップ">🌙→☀ 朝まで</button><div class="spd" id="spd"><button data-s="0">II</button><button data-s="1" class="on">▶</button><button data-s="2">▶▶</button><button data-s="4">▶▶▶</button></div></div>
    <div id="tbMoney" class="tb px"><img class="pxi" id="moneyIcon" alt=""><div class="m" id="money">¥0</div></div>
  </div>
  <div id="mission" class="px hidden"></div>
  <div id="side">
    <button class="pbtn" id="bRotL" title="左に回す (Q)"></button>
    <button class="pbtn" id="bRotR" title="右に回す (E)"></button>
    <button class="pbtn" id="bZoomIn" title="ズーム">＋</button>
    <button class="pbtn" id="bZoomOut" title="ズーム">－</button>
    <button class="pbtn" id="bPhoto" title="写真モード"></button>
  </div>
  <div id="toasts"></div>
  <div id="buildBar" class="px hidden"></div>
  <div id="info" class="px hidden"></div>
  <div id="buildPanel" class="px hidden"><div id="bTabs"></div><div id="bCards"></div></div>
  <div id="toolbar" class="px"></div>

function iconRows(name) {
  const rows = (ICONS[name] || ICONS.star).map(r => (r + '............').slice(0, 12));
  const pad = 12 - rows.length, top = Math.floor(pad / 2);
  const out = [];
  for (let i = 0; i < top; i++) out.push('............');
  out.push(...rows);
  while (out.length < 12) out.push('............');
  return out.slice(0, 12);
}
function drawIcon(ctx, name, ox, oy, scale) {
  scale = scale || 1;
  const rows = iconRows(name);
  for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
    const ch = rows[y][x];
    if (ch === '.' || !PAL[ch]) continue;
    ctx.fillStyle = PAL[ch];
    ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
  }
}
const _iconURL = {};
function iconURL(name, scale) {
  scale = scale || 3;
  const key = name + '@' + scale;
  if (_iconURL[key]) return _iconURL[key];
  const c = document.createElement('canvas'); c.width = c.height = 12 * scale;
  drawIcon(c.getContext('2d'), name, 0, 0, scale);
  return (_iconURL[key] = c.toDataURL());
}
function iconImg(name, cls) { return `<img class="pxi ${cls || ''}" src="${iconURL(name)}" alt="">`; }

// アイコンアトラス（3D用：看板・ふきだし） 16x16 セル × 16列
const ICON_LIST = Object.keys(ICONS);
const ICON_INDEX = {}; ICON_LIST.forEach((n, i) => ICON_INDEX[n] = i);
function makeIconAtlas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ICON_LIST.forEach((n, i) => {
    const cx = (i % 16) * 16, cy = Math.floor(i / 16) * 16;
    drawIcon(ctx, n, cx + 2, cy + 2, 1);
  });
  return c;
}
// ふきだし付き（白い丸に中身）
function makeBubbleAtlas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ICON_LIST.forEach((n, i) => {
    const cx = (i % 16) * 16, cy = Math.floor(i / 16) * 16;
    ctx.fillStyle = PAL.k; ctx.fillRect(cx + 1, cy + 0, 14, 14); ctx.fillRect(cx + 6, cy + 14, 3, 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(cx + 2, cy + 1, 12, 12); ctx.fillRect(cx + 7, cy + 13, 1, 1);
    ctx.save(); ctx.translate(cx + 2, cy + 1);
    const rows = iconRows(n);
    for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
      const ch = rows[y][x]; if (ch === '.' || !PAL[ch]) continue;
      ctx.fillStyle = PAL[ch]; ctx.fillRect(x, y, 1, 1);
    }
    ctx.restore();
  });
  return c;
}

//  地面タイルアトラス（16px × 16列）
// ============================================================
const TILE = {
  GRASS: 0, SAND: 4, DIRT: 5, ROCK: 6, SEABED: 7, TFLOOR: 8, TFLOOR2: 9, WALK: 10, PLAZA: 11, APRON: 12, LOCK: 13,
  TAXI: 16, ROAD: 32, SIDE_GRASS: 48, SIDE_DIRT: 49, SIDE_ROCK: 50, SIDE_SAND: 51, PARK: 52, SNOWGRASS: 53
};
const SEASON_GRASS = [
  ['#7cc46a', '#6db55e', '#8fd27a', '#5ea452'],    // 春
  ['#58b04f', '#4a9e45', '#68c05a', '#3e8a3c'],    // 夏
  ['#b8b25a', '#a89f4c', '#c9c46c', '#968c40'],    // 秋
  ['#eef4fa', '#dde8f2', '#ffffff', '#c8d8e8'],    // 冬
];
function px(ctx, x, y, col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
function tileXY(t) { return [(t % 16) * 16, Math.floor(t / 16) * 16]; }
function drawGrassTiles(ctx, season) {
  const pal = SEASON_GRASS[season];
  for (let v = 0; v < 4; v++) {
    const [ox, oy] = tileXY(TILE.GRASS + v);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const h = hash2(x + v * 31, y, 7);
      let col = pal[0];
      if (h < 0.18) col = pal[1]; else if (h < 0.26) col = pal[2]; else if (h > 0.95) col = pal[3];
      px(ctx, ox + x, oy + y, col);
    }
    // 草の房・季節の点
    for (let k = 0; k < 5; k++) {
      const x = Math.floor(hash2(v, k, 3) * 14) + 1, y = Math.floor(hash2(k, v, 9) * 13) + 2;
      if (season === 3) { px(ctx, ox + x, oy + y, '#c0d4e6'); continue; }
      px(ctx, ox + x, oy + y, pal[3]); px(ctx, ox + x, oy + y - 1, pal[2]);
    }
    const dots = season === 0 ? ['#ffd0e4', '#ffffff', '#ffe066'] : season === 2 ? ['#e0702c', '#d84c2c', '#f0b040'] : season === 1 ? ['#ffffff', '#ffe066'] : ['#ffffff'];
    const nd = season === 1 ? 1 : season === 3 ? 3 : 3;
    for (let k = 0; k < nd; k++) {
      if (hash2(v, k, 77) < 0.45) continue;
      const x = Math.floor(hash2(v, k, 12) * 14) + 1, y = Math.floor(hash2(k, v, 15) * 14) + 1;
      px(ctx, ox + x, oy + y, dots[k % dots.length]);
    }
  }
  // 側面（草つき土）
  const [sx, sy] = tileXY(TILE.SIDE_GRASS);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const h = hash2(x, y, 41);
    let col = y < 3 + (hash2(x, 0, 5) < 0.4 ? 1 : 0) ? pal[y === 0 ? 2 : 1] : (h < 0.2 ? '#7a5434' : h < 0.3 ? '#9a6c44' : '#8a603c');
    if (y > 9 && h > 0.85) col = '#6a4a30';
    px(ctx, sx + x, sy + y, col);
  }
}
function drawAsphalt(ctx, ox, oy, base, dark, light, seed) {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const h = hash2(x, y, seed);
    px(ctx, ox + x, oy + y, h < 0.12 ? dark : h > 0.93 ? light : base);
  }
}
function makeTileAtlas(season) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  drawGrassTiles(ctx, season);
  // 砂
  let [ox, oy] = tileXY(TILE.SAND);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const h = hash2(x, y, 2); px(ctx, ox + x, oy + y, h < .15 ? '#e2c98c' : h > .9 ? '#fff0c0' : '#f0dca0'); }
  [ox, oy] = tileXY(TILE.DIRT);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const h = hash2(x, y, 3); px(ctx, ox + x, oy + y, h < .2 ? '#7a5434' : h > .9 ? '#a87a50' : '#8a603c'); }
  [ox, oy] = tileXY(TILE.ROCK);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const h = hash2(x, y, 4); px(ctx, ox + x, oy + y, h < .2 ? '#5a5466' : h > .85 ? '#8a8496' : '#6e687a'); }
  [ox, oy] = tileXY(TILE.SEABED);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const h = hash2(x, y, 5); px(ctx, ox + x, oy + y, h < .2 ? '#c8b080' : '#d8c090'); }
  // ターミナル床（つやのあるタイル）
  for (const [t, a, b2] of [[TILE.TFLOOR, '#ece6da', '#ddd4c4'], [TILE.TFLOOR2, '#e4dccc', '#d2c8b4']]) {
    [ox, oy] = tileXY(t);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      let col = ((x >> 3) + (y >> 3)) % 2 ? a : b2;
      if (x % 8 === 0 || y % 8 === 0) col = '#c4b8a4';

    if (!(m & 1)) ctx.fillRect(ox, oy, 16, 1);
    if (!(m & 2)) ctx.fillRect(ox + 15, oy, 1, 16);
    if (!(m & 4)) ctx.fillRect(ox, oy + 15, 16, 1);

function makeRunwayTexture(len, wid, num) {
  const S = 16;
  const c = document.createElement('canvas'); c.width = len * S; c.height = wid * S;
  const ctx = c.getContext('2d');
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const h = hash2(x, y, 31);
    px(ctx, x, y, h < .1 ? '#3e3e48' : h > .95 ? '#5a5a66' : '#474752');
  }
  ctx.fillStyle = '#f4f4f4';
  // 端の白線
  ctx.fillRect(0, 1, c.width, 1); ctx.fillRect(0, c.height - 2, c.width, 1);
  // 中心線（破線）
  const cy = Math.floor(c.height / 2) - 1;
  for (let x = 40; x < c.width - 40; x += 16) ctx.fillRect(x, cy, 9, 2);
  // 末端のしましま
  for (const e of [0, 1]) {
    const x0 = e ? c.width - 14 : 4;
    for (let y = 4; y < c.height - 4; y += 4) ctx.fillRect(x0, y, 10, 2);
    // 接地帯
    const tz = e ? c.width - 52 : 36;
    ctx.fillRect(tz, cy - 6, 12, 2); ctx.fillRect(tz, cy + 6, 12, 2);
  }
  // 番号
  ctx.save();
  ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.translate(26, c.height / 2); ctx.rotate(Math.PI / 2); ctx.fillText(String(num).padStart(2, '0'), 0, 0); ctx.restore();
  ctx.save(); ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.translate(c.width - 26, c.height / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(String((num + 18) % 36 || 36).padStart(2, '0'), 0, 0); ctx.restore();
  return c;
}
function makeStandTexture(sz, num) {
  const S = 16;
  const c = document.createElement('canvas'); c.width = sz * S; c.height = sz * S;
  const ctx = c.getContext('2d');
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const h = hash2(x, y, 33);
    let col = h < .1 ? '#a4a4ac' : h > .95 ? '#cacad2' : '#b8b8c0';
    if (x % 32 === 0 || y % 32 === 0) col = '#a0a0a8';
    px(ctx, x, y, col);
  }
  ctx.fillStyle = '#f2c230';
  const cx = c.width / 2;
  ctx.fillRect(cx - 1, 6, 2, c.height - 6);           // 誘導線
  ctx.fillRect(cx - 10, c.height * 0.3, 20, 2);        // 停止線
  ctx.fillStyle = '#e5484d';
  ctx.fillRect(2, 2, c.width - 4, 1); ctx.fillRect(2, 2, 1, c.height - 4); ctx.fillRect(c.width - 3, 2, 1, c.height - 4);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(num), cx + 12, c.height - 10);
  return c;
}

// ============================================================
//  サウンド（WebAudio で全部その場で作る）
// ============================================================
const Sound = {
  ctx: null, master: null, bgmGain: null, seGain: null, noiseBuf: null, pulse25: null, pulse12: null,
  vol: { bgm: 0.45, se: 0.7 }, cur: null, song: null, step: 0, nextT: 0, timer: null, lastSe: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(c.destination);
    this.bgmGain = c.createGain(); this.bgmGain.gain.value = this.vol.bgm; this.bgmGain.connect(this.master);
    this.seGain = c.createGain(); this.seGain.gain.value = this.vol.se; this.seGain.connect(this.master);
    // ちょっとだけ響き（ディレイ）
    this.delay = c.createDelay(); this.delay.delayTime.value = 0.27;
    this.fb = c.createGain(); this.fb.gain.value = 0.22;
    this.wet = c.createGain(); this.wet.gain.value = 0.25;
    this.delay.connect(this.fb); this.fb.connect(this.delay); this.delay.connect(this.wet); this.wet.connect(this.bgmGain);
    const n = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, n, n);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.pulse25 = this.makePulse(0.25); this.pulse12 = this.makePulse(0.125);
    if (this.want) { const w = this.want; this.want = null; this.bgm(w); }
  },
  makePulse(duty) {
    const N = 32, re = new Float32Array(N), im = new Float32Array(N);
    for (let k = 1; k < N; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return this.ctx.createPeriodicWave(re, im);
  },
  setVol(kind, v) {
    this.vol[kind] = v;
    if (!this.ctx) return;
    (kind === 'bgm' ? this.bgmGain : this.seGain).gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
  },
  freq(name) {
    const m = /^([A-G])([#b]?)(\d)$/.exec(name); if (!m) return 440;
    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    const midi = (parseInt(m[3]) + 1) * 12 + base;
    return 440 * Math.pow(2, (midi - 69) / 12);
  },
  tone(t, f, dur, type, vol, dest, opt) {
    const c = this.ctx; opt = opt || {};
    const o = c.createOscillator(), g = c.createGain();
    if (type === 'p25') o.setPeriodicWave(this.pulse25); else if (type === 'p12') o.setPeriodicWave(this.pulse12); else o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, t + dur);
    if (opt.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 5.5; lg.gain.value = f * 0.012; l.connect(lg); lg.connect(o.frequency); l.start(t + 0.1); l.stop(t + dur + 0.1); }
    const a = opt.a || 0.006, r = opt.r || Math.min(0.12, dur * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol * (opt.sus || 0.7), t + Math.max(a, dur - r));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + r);
    o.connect(g); g.connect(dest || this.seGain);
    if (opt.send) g.connect(this.delay);
    o.start(t); o.stop(t + dur + r + 0.02);
  },
  noise(t, dur, vol, hp, lp, dest, opt) {
    const c = this.ctx; opt = opt || {};
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const g = c.createGain(); let node = s;
    if (hp) { const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }
    if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(lp, t); if (opt.lpTo) f.frequency.exponentialRampToValueAtTime(opt.lpTo, t + dur); node.connect(f); node = f; }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opt.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(dest || this.seGain);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  se(name) {
    if (!this.ctx || this.vol.se <= 0) return;
    const now = this.ctx.currentTime;
    if (this.lastSe[name] && now - this.lastSe[name] < 0.05) return;
    this.lastSe[name] = now;
    const t = now + 0.01, F = n => this.freq(n);
    switch (name) {
      case 'click': this.tone(t, F('E6'), 0.03, 'square', 0.08); break;
      case 'tab': this.tone(t, F('A5'), 0.03, 'p25', 0.08); this.tone(t + 0.03, F('E6'), 0.03, 'p25', 0.06); break;
      case 'open': this.tone(t, F('C5'), 0.05, 'p25', 0.1); this.tone(t + 0.05, F('G5'), 0.07, 'p25', 0.1); break;
      case 'close': this.tone(t, F('G5'), 0.05, 'p25', 0.08); this.tone(t + 0.05, F('C5'), 0.07, 'p25', 0.08); break;
      case 'place':
        this.noise(t, 0.08, 0.25, 0, 900); this.tone(t, F('C3'), 0.08, 'triangle', 0.4, null, { slide: 60 });
        this.tone(t + 0.06, F('E6'), 0.05, 'p25', 0.07); this.tone(t + 0.1, F('B6'), 0.06, 'p25', 0.06); break;
      case 'paint': this.tone(t, F('G4') * (0.95 + Math.random() * 0.1), 0.03, 'triangle', 0.15); break;
      case 'demolish': this.noise(t, 0.35, 0.35, 0, 1500, null, { lpTo: 200 }); this.tone(t, 120, 0.3, 'square', 0.12, null, { slide: 40 }); break;
      case 'error': this.tone(t, 160, 0.12, 'square', 0.12); this.tone(t + 0.13, 120, 0.16, 'square', 0.12); break;
      case 'coin': this.tone(t, F('B5'), 0.06, 'square', 0.1); this.tone(t + 0.06, F('E6'), 0.18, 'square', 0.1); break;
      case 'money': for (let i = 0; i < 3; i++) this.tone(t + i * 0.05, F(['E6', 'G6', 'C7'][i]), 0.06, 'p25', 0.08); break;
      case 'chime': // ピンポンパンポーン
        ['F5', 'A5', 'C6', 'F6'].forEach((n, i) => this.tone(t + i * 0.32, F(n), 0.5, 'sine', 0.22, null, { r: 0.3 })); break;
      case 'chime2':
        ['F6', 'C6', 'A5', 'F5'].forEach((n, i) => this.tone(t + i * 0.32, F(n), 0.5, 'sine', 0.2, null, { r: 0.3 })); break;
      case 'levelup':
        ['C5', 'E5', 'G5', 'C6', 'E6', 'G6'].forEach((n, i) => this.tone(t + i * 0.07, F(n), 0.12, 'p25', 0.12));
        this.tone(t + 0.45, F('C6'), 0.5, 'p25', 0.12, null, { vib: true }); this.tone(t + 0.45, F('E5'), 0.5, 'triangle', 0.2); break;
      case 'combo':
        ['G5', 'C6', 'E6', 'G6', 'C7'].forEach((n, i) => this.tone(t + i * 0.05, F(n), 0.1, 'p12', 0.1)); break;
      case 'notify': this.tone(t, F('A5'), 0.06, 'sine', 0.15); this.tone(t + 0.08, F('D6'), 0.12, 'sine', 0.15); break;
      case 'bad': this.tone(t, F('E4'), 0.12, 'p25', 0.1); this.tone(t + 0.13, F('C4'), 0.2, 'p25', 0.1); break;
      case 'jet': this.noise(t, 2.2, 0.12, 200, 2500, null, { a: 0.6, lpTo: 600 }); break;
      case 'prop': this.noise(t, 1.6, 0.08, 100, 900, null, { a: 0.4 }); this.tone(t, 70, 1.4, 'sawtooth', 0.03); break;
      case 'land': this.noise(t, 0.12, 0.12, 2000, 6000); break;
      case 'talk': this.tone(t, F('C5') * (1 + Math.random() * 0.2), 0.025, 'p25', 0.05); break;
      case 'stamp': this.noise(t, 0.1, 0.4, 0, 600); this.tone(t, 90, 0.1, 'triangle', 0.4); break;
      case 'firework': this.tone(t, 300, 0.6, 'sine', 0.05, null, { slide: 1200 }); this.noise(t + 0.6, 0.8, 0.3, 0, 3000, null, { lpTo: 300 }); break;
      case 'train': for (let i = 0; i < 4; i++) this.noise(t + i * 0.25, 0.12, 0.12, 200, 1200); break;
      case 'shutter': this.noise(t, 0.05, 0.3, 1000, 0); this.noise(t + 0.08, 0.05, 0.25, 1000, 0); break;
    }
  },
  // ---------- BGM ----------
  bgm(name) {
    if (!this.ctx) { this.want = name; return; }
    if (this.cur === name) return;
    this.cur = name; this.song = SONGS[name] ? compileSong(SONGS[name]) : null; this.step = 0;
    this.nextT = this.ctx.currentTime + 0.1;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 30);
  },
  tick() {
    if (!this.song || !this.ctx || this.vol.bgm <= 0) { if (this.ctx) this.nextT = this.ctx.currentTime + 0.05; return; }
    const S = this.song, sd = 60 / S.bpm / 4;
    while (this.nextT < this.ctx.currentTime + 0.15) {
      const st = this.step % S.len, t = this.nextT;
      for (const ev of S.events[st] || []) {
        if (ev.drum) {
          if (ev.drum === 'k') { this.tone(t, 150, 0.09, 'sine', 0.35, this.bgmGain, { slide: 45 }); }

          else if (ev.drum === 'h') { this.noise(t, 0.03, 0.05, 6000, 0, this.bgmGain); }
        } else {
          this.tone(t, ev.f, ev.len * sd * 0.92, ev.inst, ev.vol, this.bgmGain, { send: ev.send, vib: ev.vib, sus: ev.sus });
        }
      }
      this.nextT += sd; this.step++;
    }
  }
};

function compileSong(S) {
  const F = n => Sound.freq(n);
  const chords = S.chords.split(/\s+/);
  const len = chords.length * 16;
  const events = new Array(len).fill(0).map(() => []);
  const addMel = (str, vol, inst, offsetBars, octShift) => {
    let st = (offsetBars || 0) * 16;
    for (const tok of str.replace(/\|/g, ' ').split(/\s+/).filter(Boolean)) {
      const [n, l] = tok.split('.'); const L = parseInt(l) || 2;
      if (n !== 'r' && st < len) {
        let f = F(n); if (octShift) f *= Math.pow(2, octShift);
        events[st].push({ f, len: L, inst, vol, send: true, vib: L >= 6, sus: 0.6 });
      }
      st += L;
    }
  };
  const melVol = S.soft ? 0.09 : 0.075;
  addMel(S.mel, melVol, S.lead);
  // 2周目のメロディがあれば交互に…今回は簡単に：mel2 は 1オクターブ下のハモリとして重ねる
  if (S.mel2) { /* 長さ2倍にする */ }
  chords.forEach((ch, bi) => {
    const notes = CHORDS[ch] || CHORDS.C, b0 = bi * 16;
    const root = notes[0];
    // ベース
    const bv = S.soft ? 0.16 : 0.2;
    if (S.bassPat === 'long') {
      events[b0].push({ f: F(root + '2'), len: 8, inst: 'triangle', vol: bv });
      events[b0 + 8].push({ f: F(notes[2] + '2'), len: 8, inst: 'triangle', vol: bv * 0.9 });
    } else if (S.bassPat === 'walk') {
      [root + '2', notes[1] + '2', notes[2] + '2', notes[1] + '2'].forEach((n, i) => events[b0 + i * 4].push({ f: F(n), len: 3, inst: 'triangle', vol: bv }));
    } else {
      [0, 4, 6, 8, 12, 14].forEach((s, i) => events[b0 + s].push({ f: F((i % 3 === 1 ? notes[2] : root) + (i === 3 ? '3' : '2')), len: 2, inst: 'triangle', vol: bv }));
    }
    // アルペジオ
    if (S.arp) {
      const seq = [notes[0] + '4', notes[1] + '4', notes[2] + '4', notes[1] + '4'];
      for (let s = 0; s < 16; s += 2) events[b0 + s].push({ f: F(seq[(s / 2) % 4]), len: 1.5, inst: 'p12', vol: S.soft ? 0.035 : 0.03 });
    }
    // ドラム
    for (let s = 0; s < 16; s++) {
      const d = S.drums;
      if (d === 'pop') { if (s === 0 || s === 8 || s === 10) events[b0 + s].push({ drum: 'k' }); if (s === 4 || s === 12) events[b0 + s].push({ drum: 's' }); if (s % 2 === 0) events[b0 + s].push({ drum: 'h' }); }
      if (d === 'soft') { if (s === 0) events[b0 + s].push({ drum: 'k' }); if (s % 4 === 2) events[b0 + s].push({ drum: 'h' }); }
      if (d === 'march') { if (s % 4 === 0) events[b0 + s].push({ drum: 'k' }); if (s === 4 || s === 12 || s === 14) events[b0 + s].push({ drum: 's' }); if (s % 2 === 1) events[b0 + s].push({ drum: 'h' }); }
    }
  });
  if (S.mel2) {
    // mel2 があれば曲を2倍にして後半に入れる
    const ev2 = events.map(e => e.filter(x => !x.send || x.inst !== S.lead).slice());
    const all = events.concat(ev2);
    const tmp = { events: all, len: len * 2 };
    let st = len;
    for (const tok of S.mel2.replace(/\|/g, ' ').split(/\s+/).filter(Boolean)) {
      const [n, l] = tok.split('.'); const L = parseInt(l) || 2;
      if (n !== 'r' && st < len * 2) all[st].push({ f: F(n), len: L, inst: S.lead, vol: melVol, send: true, vib: L >= 6, sus: 0.6 });
      st += L;
    }
    return { bpm: S.bpm, len: tmp.len, events: tmp.events };
  }
  return { bpm: S.bpm, len, events };
}

  // 水面

  // 後処理
  R.postMat = new THREE.ShaderMaterial({
    uniforms: {
      tColor: { value: null }, tDepth: { value: null }, res: { value: new THREE.Vector2(1, 1) },
      tilt: { value: 0.8 }, outline: { value: 1 }, depthRange: { value: 399 }, bloom: { value: 0.25 },
      grade: { value: new THREE.Vector3(1, 1, 1) }, sat: { value: 1.08 }, vig: { value: 0.35 }, flash: { value: 0 }
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: `
      precision highp float;
      uniform sampler2D tColor; uniform sampler2D tDepth; uniform vec2 res; uniform float tilt; uniform float outline;
      uniform float depthRange; uniform float bloom; uniform vec3 grade; uniform float sat; uniform float vig; uniform float flash;
      varying vec2 vUv;
      float D(vec2 u){ return texture2D(tDepth, u).x; }
      vec3 C(vec2 u){ return texture2D(tColor, u).rgb; }
      void main(){
        vec2 px = 1.0 / res;
        vec2 uv = (floor(vUv * res) + 0.5) * px;
        vec3 col = C(uv);

        if (t > 0.02) {
          vec3 acc = col; float w = 1.0;

          for (int i = 0; i < 6; i++) { float a = float(i) * 1.0471975 + 0.5; vec2 o = vec2(cos(a), sin(a)) * px * t * 4.0; acc += C(uv + o); w += 1.0; }
          col = acc / w;
        }
        if (outline > 0.5) {
          float d = D(uv);
          float dn = max(max(D(uv + vec2(px.x, 0.)) - d, D(uv - vec2(px.x, 0.)) - d), max(D(uv + vec2(0., px.y)) - d, D(uv - vec2(0., px.y)) - d));
          if (dn * depthRange > 0.45 && d < 0.999) col *= 0.58;
        }
        if (bloom > 0.0) {
          vec3 b = vec3(0.);
          for (int i = 0; i < 8; i++) { float a = float(i) * 0.7853981; vec2 o = vec2(cos(a), sin(a)) * px * 2.5;
            vec3 s = C(uv + o); b += max(s - 0.72, 0.0); }
          col += b * bloom * 0.5;
        }
        float l = dot(col, vec3(0.299, 0.587, 0.114));
        col = mix(vec3(l), col, sat) * grade;
        vec2 q = vUv - 0.5; col *= 1.0 - dot(q, q) * vig;
        col = mix(col, vec3(1.0), flash);
        gl_FragColor = vec4(col, 1.0);

    if (!G.sectors[sy * SECW + sx]) continue;
    for (let d = 0; d < 4; d++) {
      const [dx, dy] = DIRS4[d], nx = sx + dx, ny = sy + dy;
      if (nx < 0 || ny < 0 || nx >= SECW || ny >= SECH || G.sectors[ny * SECW + nx]) continue;
      for (let k = 0; k < SEC; k++) {
        let x, z;
        if (dx === 1) { x = (sx + 1) * SEC; z = sy * SEC + k + 0.5; } else if (dx === -1) { x = sx * SEC; z = sy * SEC + k + 0.5; }
        else if (dy === 1) { z = (sy + 1) * SEC; x = sx * SEC + k + 0.5; } else { z = sy * SEC; x = sx * SEC + k + 0.5; }
        const tx = Math.floor(x - (dx === 1 ? 0.5 : dx === -1 ? 0.5 : 0)), tz = Math.floor(z - (dy === 1 ? 0.5 : dy === -1 ? 0.5 : 0));
        if (!isLand(Math.min(W - 1, Math.max(0, tx)), Math.min(H - 1, Math.max(0, tz)))) continue;
        mb.box(x, 0, z, 0.08, 0.35, 0.08, '#e8d8b8');
        mb.box(x, 0.22, z, dx ? 0.05 : 0.95, 0.06, dx ? 0.95 : 0.05, '#ffffff');
      }
    }
  }
  const fence = mb.build(); g.add(fence);
  R.scene.add(g); World.lockMesh = g;
}
function buildGridMesh() {

    fragmentShader: 'uniform float op; varying vec2 vP; void main(){ vec2 f = fract(vP); float l = step(f.x, 0.04) + step(f.y, 0.04); if (l < 0.5) discard; gl_FragColor = vec4(1.,1.,1., op); }'

// 建物メッシュ
function spawnBuildingMesh(b) {

function placeMeshAt(m, def, x, y, rot) {

// ============================================================
//  人の通り道（フローフィールド）
// ============================================================
let WALKABLE = new Uint8Array(W * H);
function rebuildWalkable() {
  for (let i = 0; i < W * H; i++) {
    const f = G.floor[i];
    WALKABLE[i] = (f === FLOOR.TERM || f === FLOOR.WALK || f === FLOOR.ROAD) && !G.occ[i] ? 1 : 0;
  }
  RT.dirtyWalk = false; RT.walkVer = (RT.walkVer || 0) + 1;
}
// 建物の前のマス（人が並ぶ場所）
function accessTiles(b) {
  if (RT.dirtyWalk) rebuildWalkable();
  if (b._acc && b._accV === RT.walkVer) return b._acc;
  const def = B[b.id];
  const [w, h] = dims(def, b.rot);
  const [fx, fy] = frontDir(b.rot);
  const out = [];
  const push = (x, y) => { if (inMap(x, y) && WALKABLE[idx(x, y)]) out.push(idx(x, y)); };
  if (fx === 0) { const yy = fy > 0 ? b.y + h : b.y - 1; for (let x = b.x; x < b.x + w; x++) push(x, yy); }
  else { const xx = fx > 0 ? b.x + w : b.x - 1; for (let y = b.y; y < b.y + h; y++) push(xx, y); }
  if (!out.length) {
    for (let x = b.x; x < b.x + w; x++) { push(x, b.y - 1); push(x, b.y + h); }
    for (let y = b.y; y < b.y + h; y++) { push(b.x - 1, y); push(b.x + w, y); }
  }
  // 中央に近い順
  const c = bCenter(b);
  out.sort((a, bb) => Math.hypot(a % W + 0.5 - c.x, Math.floor(a / W) + 0.5 - c.z) - Math.hypot(bb % W + 0.5 - c.x, Math.floor(bb / W) + 0.5 - c.z));
  b._acc = out; b._accV = RT.walkVer;
  return out;
}
function getField(b) {
  if (RT.dirtyWalk) rebuildWalkable();
  let f = RT.fieldCache.get(b.uid);
  if (f) return f;
  f = new Int16Array(W * H).fill(-1);
  const q = new Int32Array(W * H); let qh = 0, qt = 0;
  for (const i of accessTiles(b)) { f[i] = 0; q[qt++] = i; }
  while (qh < qt) {
    const i = q[qh++], x = i % W, y = (i / W) | 0, d = f[i] + 1;
    for (let k = 0; k < 8; k++) {
      const [dx, dy] = DIRS8[k], nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const ni = ny * W + nx;
      if (f[ni] >= 0 || !WALKABLE[ni]) continue;
      if (k >= 4 && (!WALKABLE[y * W + nx] || !WALKABLE[ny * W + x])) continue;
      f[ni] = d; q[qt++] = ni;
    }
  }
  RT.fieldCache.set(b.uid, f);
  return f;
}

// ============================================================
//  飛行機の通り道
// ============================================================
function planePath(fromTile, toTile, allowStands) {
  const key = fromTile + '>' + toTile + ':' + allowStands.join(',');
  if (RT.planePathCache.has(key)) return RT.planePathCache.get(key);
  const prev = new Int32Array(W * H).fill(-2);
  const q = [fromTile]; prev[fromTile] = -1;
  let found = false;
  const ok = i => {
    const f = G.floor[i];
    if (f === FLOOR.TAXI || f === FLOOR.RUNWAY) return true;
    if (f === FLOOR.APRON) return allowStands.includes(G.occ[i]);
    return false;
  };
  for (let h = 0; h < q.length; h++) {
    const i = q[h]; if (i === toTile) { found = true; break; }
    const x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of DIRS4) {
      const nx = x + dx, ny = y + dy; if (!inMap(nx, ny)) continue;
      const ni = idx(nx, ny); if (prev[ni] !== -2 || !ok(ni)) continue;
      prev[ni] = i; q.push(ni);
    }
  }
  let path = null;
  if (found) { path = []; for (let i = toTile; i !== -1; i = prev[i]) path.push(i); path.reverse(); }
  RT.planePathCache.set(key, path);
  return path;
}
function runwayInfo(b) {
  const def = B[b.id];
  const [w, h] = dims(def, b.rot);
  const horiz = b.rot % 2 === 0;
  const mid = horiz ? b.y + Math.floor(h / 2) : b.x + Math.floor(w / 2);
  const len = horiz ? w : h;
  const c = horiz ? b.y + h / 2 : b.x + w / 2;
  // 端（0=始点側 1=終点側）
  const endTile = e => horiz ? idx(e ? b.x + w - 1 : b.x, mid) : idx(mid, e ? b.y + h - 1 : b.y);
  return { horiz, len, c, x0: horiz ? b.x : b.y, x1: horiz ? b.x + w : b.y + h, endTile, cls: def.cls, w, h };
}
// 滑走路と駐機場がつながっているか
function standReachable(stand, runway) {
  const ri = runwayInfo(runway);
  const sc = bCenter(stand), st = idx(Math.floor(sc.x), Math.floor(sc.z));
  for (const e of [0, 1]) { const p = planePath(ri.endTile(e), st, [stand.uid]); if (p) return true; }
  return false;
}

// ---------- 搭乗口と駐機場のリンク ----------
function rectDist(a, b) {
  const da = dims(B[a.id], a.rot), db = dims(B[b.id], b.rot);
  const dx = Math.max(0, a.x - (b.x + db[0] - 1), b.x - (a.x + da[0] - 1));
  const dy = Math.max(0, a.y - (b.y + db[1] - 1), b.y - (a.y + da[1] - 1));
  return dx + dy;
}
function relinkGates() {
  const stands = Object.values(G.blds).filter(b => B[b.id].kind === 'stand').sort((a, b) => a.num - b.num);
  const gates = Object.values(G.blds).filter(b => B[b.id].kind === 'gate');
  const used = new Set();
  for (const s of stands) {
    const prev = s.gate && G.blds[s.gate];
    if (prev && !used.has(prev.uid) && (B[prev.id].bus || rectDist(s, prev) <= 7)) { used.add(prev.uid); continue; }
    s.gate = 0;
  }
  for (const s of stands) {
    if (s.gate) continue;
    let best = null, bd = 1e9;
    for (const g of gates) {
      if (used.has(g.uid)) continue;
      const d = rectDist(s, g);
      if (!B[g.id].bus && d > 7) continue;
      const score = d + (B[g.id].bus ? 30 : 0);
      if (score < bd) { bd = score; best = g; }
    }
    if (best) { s.gate = best.uid; used.add(best.uid); }
  }
  for (const g of gates) g.stand = 0;
  for (const s of stands) if (s.gate && G.blds[s.gate]) G.blds[s.gate].stand = s.uid;
  RT.dirtyLinks = false;
}

// ---------- 美しさ ----------
function rebuildBeauty() {
  const be = RT.beauty; be.fill(0);
  const season = dateOf(G.day).season;
  const night = RT.nightF > 0.5;
  const add = (cx, cy, v, r) => {
    for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(H - 1, Math.floor(cy + r)); y++)
      for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W - 1, Math.floor(cx + r)); x++) {
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
        if (d <= r) be[idx(x, y)] += v * (1 - d / (r + 1));
      }
  };
  for (const b of Object.values(G.blds)) {
    const def = B[b.id]; let v = def.beauty || 0;
    if (!v) continue;
    if (b.id === 'sakura' && season === 0) v *= 2;
    if (def.seasonBoost != null && (def.seasonBoost === season || (def.seasonBoost === 3 && dateOf(G.day).month === 12))) v *= 2;
    if (G.flags.clean) v *= 1.2;
    if (def.lamp && night) v *= 2;
    if (G.research.clean) v *= 1.15;
    if (G.research.lightup && night) v *= 1.5;
    const c = bCenter(b);
    add(c.x, c.z, v, 3 + Math.min(3, (def.w + def.h) / 3));
  }
  for (let i = 0; i < W * H; i++) if (G.trees[i]) be[i] += 0.3;
  RT.dirtyBeauty = false;
}

// ---------- 組み合わせ ----------
function rebuildCombos() {
  const blds = Object.values(G.blds);
  for (const b of blds) b.combo = null;
  const active = new Set();
  for (const C of COMBOS) {
    let ids, nNeed;
    if (Array.isArray(C.need[0])) { ids = C.need[0]; nNeed = C.need[1]; } else { ids = C.need; nNeed = C.need.length; }
    const cand = blds.filter(b => ids.includes(b.id));
    for (const a of cand) {
      const ca = bCenter(a);
      const near = cand.filter(b => { const cb = bCenter(b); return Math.hypot(ca.x - cb.x, ca.z - cb.z) <= 4.6; });
      const distinct = new Set(near.map(b => b.id));
      if (distinct.size >= nNeed) {
        active.add(C.id);
        for (const b of near) { (b.combo = b.combo || []); if (!b.combo.includes(C.id)) b.combo.push(C.id); }
      }
    }
  }
  for (const id of active) if (!G.combos[id]) {
    G.combos[id] = G.day + 1;
    Bus.emit('combo', COMBOS.find(c => c.id === id));
  }
  RT.activeCombos = active;
  RT.dirtyCombo = false;
}
function comboBonus(b) {
  if (!b.combo) return 0;
  let s = 0; for (const id of b.combo) { const c = COMBOS.find(x => x.id === id); if (c) s += c.bonus; }
  return s;
}

// ---------- 警告（問題チェック） ----------
function checkWarnings() {
  const W2 = new Map();
  const blds = Object.values(G.blds);
  const runways = blds.filter(b => B[b.id].kind === 'runway');
  if (RT.dirtyWalk) rebuildWalkable();
  const cks = blds.filter(b => B[b.id].kind === 'checkin'), ckF = cks.map(getField);
  for (const b of blds) {
    const def = B[b.id];
    const msgs = [];
    if (def.kind === 'stand') {
      if (!b.gate) msgs.push('近くに搭乗口がありません（7マス以内）');
      if (runways.length && !runways.some(r => standReachable(b, r))) msgs.push('滑走路と誘導路でつながっていません');
    }
    if (def.kind === 'gate' && !b.stand) msgs.push('つながっている駐機場がありません');
    if (def.kind === 'access' && cks.length && accessTiles(b).length && !accessTiles(b).some(i => ckF.some(f => f[i] >= 0))) msgs.push('歩道でターミナル（チェックイン）とつながっていません');
    if (def.zone === 'term' || def.kind === 'access' || (def.kind === 'svc' && def.zone === 'land')) {
      if (def.kind !== 'decor' && !accessTiles(b).length) msgs.push('前に通路がありません');
    }
    if (msgs.length) W2.set(b.uid, msgs);
  }
  RT.warnings = W2;
}

// ============================================================

const MAXP = 1600;
const People = { inst: null, shadow: null, bubbles: null, frameAttr: null, flipAttr: null, bFrame: null, nextId: 1, fac: new Map() };
const WALK_SPD = 0.65;   // マス / ゲーム分

function initPeopleRender() {
  const tex = canvasTex(SPR.atlas || makePersonAtlas());

      #include <colorspace_fragment>

  });
  const bi = new THREE.InstancedMesh(bg, bm, 300); bi.count = 0; bi.frustumCulled = false; bi.renderOrder = 6;
  People.bubbles = bi; R.scene.add(bi);
}

// ---------- 施設の状態 ----------
function facOf(b) {
  let f = People.fac.get(b.uid);
  if (!f) { f = { queue: [], serving: [], today: 0 }; People.fac.set(b.uid, f); }
  return f;
}
function facCap(b) {
  const def = B[b.id];
  return Math.max(1, Math.round((def.cap || 1) * (1 + (b.lv - 1) * 0.25)));
}
function facSvc(b, p) {
  const def = B[b.id];
  let t = def.svc || 3;
  if (def.kind === 'checkin' && G.research.autock) t *= 0.7;
  if (def.kind === 'security' && G.research.smartsec) t *= 0.7;
  if ((def.kind === 'security' || def.kind === 'emig') && G.research.facegate) t *= 0.8;
  if (def.kind === 'baggage' && G.research.autobag) t *= 0.6;
  t *= 1 - (b.lv - 1) * 0.06;
  return t * rnd(0.75, 1.25);
}
// 並ぶ位置
function servicePoint(b, k, slot) {
  const acc = accessTiles(b);
  const def = B[b.id];
  const [fx, fy] = frontDir(b.rot);
  const [w, h] = dims(def, b.rot);
  const c = bCenter(b);
  // 正面の中央（建物のふち）
  let ex = c.x + fx * (w / 2), ez = c.z + fy * (h / 2);
  if (!acc.length) return { x: ex, z: ez };
  const a0 = acc[0];
  const ax = a0 % W + 0.5, az = Math.floor(a0 / W) + 0.5;
  // 正面にアクセスがない場合は最寄りの通路
  const frontOK = Math.abs((ax - c.x) * fx + (az - c.z) * fy) > 0.1;
  let bx = frontOK ? ex + fx * 0.25 : ax, bz = frontOK ? ez + fy * 0.25 : az;
  const lat = [-fy, fx];
  if (slot != null) {
    const n = facCap(b), span = Math.min((fx ? h : w) - 0.4, n * 0.45);
    const o = n > 1 ? -span / 2 + span * (slot / (n - 1)) : 0;
    return { x: bx + lat[0] * o, z: bz + lat[1] * o };
  }
  const kk = k + 1;
  return { x: bx + fx * (0.12 + kk * 0.36) + lat[0] * ((kk % 2) * 0.16 - 0.08), z: bz + fy * (0.12 + kk * 0.36) + lat[1] * ((kk % 2) * 0.16 - 0.08) };
}

// ---------- 生成 ----------
function newPerson(type, kind, x, z) {
  const vs = SPR.variants[type] || SPR.variants.worker;
  const def = PAX[type] || PAX.worker;
  const p = {
    id: People.nextId++, type, kind, v: pick(vs), x, z, nx: x, nz: z, tile: idx(clamp(Math.floor(x), 0, W - 1), clamp(Math.floor(z), 0, H - 1)),
    state: 'think', target: 0, steps: [], needs: [], mood: 58, w: 1, spd: WALK_SPD * (def.speed || 1) * rnd(0.9, 1.1),
    anim: Math.random() * 4, face: 0, flip: 0, bub: null, bubT: 0, wait: 0, stuck: 0, walked: 0, hidden: false, t0: G.min,
    money: (def.money || 1), spent: 0, seen: {}, ox: rnd(-0.28, 0.28), oz: rnd(-0.28, 0.28)
  };
  if (G.research.wifi) p.mood += 4;
  p.mood += Extra.moodStart(p);
  if (G.research.multi && (type === 'foreign')) p.mood += 8;
  if (G.flags.event === 'festival') p.mood += 5;
  if (!G.seenPax[type] && PAX[type]) { G.seenPax[type] = 1; }
  RT.persons.push(p);
  return p;
}
function rollNeeds(p) {
  const def = PAX[p.type]; if (!def) return [];
  const out = [];
  for (const [n, pr] of Object.entries(def.needs)) if (Math.random() < pr) out.push(n);
  // 長いフライト前はお腹がすく
  return out.sort(() => Math.random() - 0.5);
}
function accessPoints() {
  if (RT.apCache && RT.apVer === RT.walkVer && !RT.dirtyWalk) return RT.apCache;
  const all = Object.values(G.blds).filter(b => B[b.id].kind === 'access' && accessTiles(b).length);
  const cks = Object.values(G.blds).filter(b => B[b.id].kind === 'checkin');
  let ok = all;
  if (cks.length) {
    const fs = cks.map(getField);
    ok = all.filter(ap => accessTiles(ap).some(i => fs.some(f => f[i] >= 0)));
    if (!ok.length) ok = all;
  }
  RT.apCache = ok; RT.apVer = RT.walkVer;
  return ok;
}
function spawnAt(b) {
  const acc = accessTiles(b);
  const i = pick(acc);
  return { x: i % W + 0.5 + rnd(-0.3, 0.3), z: Math.floor(i / W) + 0.5 + rnd(-0.3, 0.3) };
}
function chooseAccess(type) {
  const aps = accessPoints(); if (!aps.length) return null;
  return weightedPick(aps, b => (B[b.id].access || 10) * Extra.accessMul(b) * (B[b.id].likes && B[b.id].likes.includes(type) ? 2 : 1));

// ---------- 路線 ----------
const ROUTE_COST = { dom: 300000, asia: 1500000, long: 4000000, space: 30000000 };
function maxRunwayCls() { let c = 0; for (const b of Object.values(G.blds)) if (B[b.id].kind === 'runway') c = Math.max(c, B[b.id].cls); return c; }
function maxStandCls() { let c = 0; for (const b of Object.values(G.blds)) if (B[b.id].kind === 'stand' && (b.gate || true)) c = Math.max(c, B[b.id].cls); return c; }
// その路線で使える機材（滑走路・駐機場の大きさ、ランク、距離）
function planesFor(airlineId, cityId) {
  const al = AIRLINES[airlineId], city = CITIES[cityId];
  const minCls = REGION_CLS[city.region];
  const rc = maxRunwayCls(), sc = maxStandCls();
  return al.fleet.filter(t => {
    const P = PLANES[t];
    if (P.rank > G.rank && !G.free) return false;
    if (P.cls < minCls && !(al.cargo && P.cargo)) return false;
    return P.cls <= rc && (P.stand || P.cls) <= sc;
  });
}
function bestPlaneFor(airlineId, cityId) {
  let best = null;
  for (const t of planesFor(airlineId, cityId)) { const P = PLANES[t]; if (!best || P.seats + (P.cargo || 0) * 4 > PLANES[best].seats + (PLANES[best].cargo || 0) * 4) best = t; }
  return best;
}
function airlineAvailable(id) {
  const al = AIRLINES[id];
  if (G.free) return { ok: true };
  if (al.rank > G.rank) return { ok: false, why: `ランク${al.rank}で解放` };
  if (al.needRating && G.rating < al.needRating) return { ok: false, why: `評価★${al.needRating}以上が必要` };
  if (al.space && !G.research.spaceport) return { ok: false, why: '開発「宇宙港計画」が必要' };
  return { ok: true };
}
function routeCheck(airlineId, cityId, wantType) {
  if (RT.dirtyLinks) relinkGates();
  const al = AIRLINES[airlineId], city = CITIES[cityId];
  const a = airlineAvailable(airlineId); if (!a.ok) return a;
  if (city.rank > G.rank && !G.free) return { ok: false, why: `ランク${city.rank}で就航できます` };
  if (G.routes.some(r => r.airline === airlineId && r.city === cityId)) return { ok: false, why: 'もう就航しています' };
  if (!hasKind('tower')) return { ok: false, why: '管制塔が必要です' };
  if (!countKind('runway')) return { ok: false, why: '滑走路が必要です' };
  const t = wantType && planesFor(airlineId, cityId).includes(wantType) ? wantType : bestPlaneFor(airlineId, cityId);
  if (!t) {
    const need = REGION_CLS[city.region];
    const nm = ['', '短い滑走路', 'ふつうの滑走路', '長い滑走路'][Math.max(need, Math.min(...al.fleet.map(f => PLANES[f].cls)))];
    return { ok: false, why: `${nm}と同じ大きさの駐機場が必要です（または機材がランク不足）` };
  }
  const P = PLANES[t];
  if ((P.eng !== 'prop') && !hasKind('fire')) return { ok: false, why: 'ジェット機には消防署が必要です' };
  if (city.region !== 'dom' && city.region !== 'space' && !P.cargo && (!hasKind('emig') || !hasKind('immig'))) return { ok: false, why: '国際線には出国審査場と入国審査・税関が必要です' };
  if (P.cargo && !hasKind('cargo')) return { ok: false, why: '貨物ターミナルが必要です' };
  if (!P.cargo && !Object.values(G.blds).some(b => B[b.id].kind === 'stand' && b.gate && B[b.id].cls >= (P.stand || P.cls))) return { ok: false, why: '搭乗口とつながった駐機場が必要です（7マス以内に搭乗口）' };
  const cost = routeCost(cityId);
  if (G.money < cost && !G.free) return { ok: false, why: 'お金が足りません', cost, type: t };
  return { ok: true, cost, type: t };
}
function routeCost(cityId) { const c = CITIES[cityId]; return Math.round(ROUTE_COST[c.region] * (1 + c.demand * 0.1)); }
function maxFreq(airlineId) { const rel = (G.airlines[airlineId] || {}).rel || 0; return Math.min(6, 2 + Math.floor(rel / 25)); }
function openRoute(airlineId, cityId, freq, type) {

  if (!c.ok) { toast(c.why, 'bad'); Sound.se('error'); return null; }
  if (!G.free) G.money -= c.cost;
  const r = { id: airlineId + '-' + cityId, airline: airlineId, city: cityId, type: c.type, freq: clamp(freq || 1, 1, maxFreq(airlineId)), active: true, opened: G.day, flights: 0, pax: 0, seats: 0, ontime: 0 };

function upgradeRoutePlanes() {

function refreshAux() {
  if (RT.dirtyLinks) relinkGates();
  if (RT.dirtyBeauty) rebuildBeauty();
  if (RT.dirtyCombo) rebuildCombos();
  if (RT.dirtyAura !== false || RT.dirtyBeauty === false) {
    const a = RT.aura || (RT.aura = new Float32Array(W * H)); a.fill(0);
    const atms = [];
    for (const b of Object.values(G.blds)) {
      const d = B[b.id];
      if (b.id === 'atm') atms.push(bCenter(b));
      if (!d.aura) continue;
      const c = bCenter(b);
      for (let y = Math.max(0, Math.floor(c.z - 4)); y <= Math.min(H - 1, Math.floor(c.z + 4)); y++)
        for (let x = Math.max(0, Math.floor(c.x - 4)); x <= Math.min(W - 1, Math.floor(c.x + 4)); x++) {
          const dd = Math.hypot(x + 0.5 - c.x, y + 0.5 - c.z); if (dd <= 4) a[idx(x, y)] += d.aura * (1 - dd / 5) * 0.2;
        }
    }
    for (const b of Object.values(G.blds)) { if (B[b.id].kind !== 'svc') continue; const c = bCenter(b); b.nearATM = atms.some(a2 => Math.hypot(a2.x - c.x, a2.z - c.z) < 6); }
    RT.dirtyAura = false;
  }

}
function simStep(dt) {
  const prevMin = G.min;
  G.min += dt;

  const h0 = Math.floor(prevMin / 60), h1 = Math.floor(G.min / 60);
  if (h1 !== h0) hourlyTick(h1 % 24);
  RT.auxT = (RT.auxT || 0) + dt;
  if (RT.auxT > 3 || RT.dirtyLinks || RT.dirtyCombo) { RT.auxT = 0; refreshAux(); }
  updateFlights(dt);

  RT.slowT = (RT.slowT || 0) + dt;
  if (RT.slowT > 10) { RT.slowT = 0; checkRank(); checkAchievements(); Story.check(); }
  // 開発ポイント：便の数に応じて
  G.dev = (G.dev || 0) + dt * (RT.planes.length * 0.004 + 0.002);
}

// ---------- 入力 ----------
const Inp = { ptrs: new Map(), down: null, moved: false, pinch: 0, keys: {}, rect: null, lastTap: 0 };

    if (!p) return;

function drawChart(cv, series, cols, fmt, fixedMax) {
  if (!cv) return;
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#fffdf6'; ctx.fillRect(0, 0, w, h);
  const n = Math.max(...series.map(s => s.length));
  if (n < 1) { ctx.fillStyle = '#888'; ctx.font = '16px sans-serif'; ctx.fillText('データがまだありません（1日たつと表示されます）', 20, h / 2); return; }
  const max = fixedMax || Math.max(1, ...series.flat()) * 1.1;
  ctx.strokeStyle = '#e8d6ae'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = 10 + (h - 30) * i / 4; ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(w - 10, y); ctx.stroke(); ctx.fillStyle = '#888'; ctx.font = '12px sans-serif'; ctx.fillText(fmt(max * (1 - i / 4)), 4, y + 4); }
  series.forEach((s, k) => {
    ctx.strokeStyle = cols[k]; ctx.lineWidth = 4; ctx.beginPath();
    s.forEach((v, i) => { const x = 60 + (w - 75) * (n === 1 ? 0.5 : i / (n - 1)), y = 10 + (h - 30) * (1 - v / max); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    ctx.fillStyle = cols[k];
    s.forEach((v, i) => { const x = 60 + (w - 75) * (n === 1 ? 0.5 : i / (n - 1)), y = 10 + (h - 30) * (1 - v / max); ctx.fillRect(x - 4, y - 4, 8, 8); });
  });
}

// ---------- 元に戻す ----------
function pushUndo(a) { UI.undo.push(a); if (UI.undo.length > 30) UI.undo.shift(); renderBuildBar(); }
function doUndo() {
  const a = UI.undo.pop();
  if (!a) { toast('戻せる操作がありません'); return; }
  if (a.type === 'build') {
    const b = G.blds[a.uid];
    if (!b || b.busy) { toast('その建物はもう戻せません', 'bad'); return; }
    removeBuilding(a.uid, { noRefund: true }); if (!G.free) G.money += a.cost;
  } else if (a.type === 'paint') {
    for (const [i, prev] of a.tiles) { if (G.occ[i]) continue; G.floor[i] = prev; markChunk(i % W, Math.floor(i / W)); }
    worldChanged(null); World.dirtyWalls = true; if (!G.free) G.money += a.cost;
  }
  Sound.se('close'); toast('ひとつ前の操作を元に戻しました（お金ももどりました）', 'good', 'rotate');
  renderBuildBar();
}

// カーソル（指）の下の地面が動かないようにズーム
function zoomAt(sx, sy, k) {
  const before = screenToGround(sx, sy, 0);
  Cam.zoom = clamp(Cam.zoom * k, 0.4, 5);
  updateCamera(true);
  const after = screenToGround(sx, sy, 0);
  if (before && after) { Cam.tx += before.x - after.x; Cam.tz += before.z - after.z; clampCam(); }
  UI.follow = null;
}
// 慣性つきスクロール
function applyInertia(dtReal) {
  if (Inp.ptrs.size) return;
  const v = Inp.vel; if (!v) return;
  if (Math.hypot(v.x, v.y) < 20) { Inp.vel = null; return; }
  panCam(v.x * dtReal, v.y * dtReal);
  const d = Math.pow(0.04, dtReal); v.x *= d; v.y *= d;
}
// タッチで建てるときの「建てる／回転／やめる」ボタン（ゴーストの近くに出す）

// 飛行機を追いかけるカメラ
function updateFollow() {
  const f = UI.follow; if (!f) return;
  if (f.gone) { UI.follow = null; toast('飛行機が見えなくなりました'); return; }

const Dialog = {
  q: [], cur: null, i: 0, typing: false, onDone: null, active: false,
  show(lines, onDone) {
    if (this.active) { this.q.push([lines, onDone]); return; }
    this.lines = lines; this.i = 0; this.onDone = onDone; this.active = true;
    $('#dialog').classList.remove('hidden');
    Game.dialogPause = true;
    this.render();
  },
  render() {
    const L = this.lines[this.i];
    const P = PORTRAITS[L.who] || PORTRAITS.jii;
    $('#dPor').src = portraitURL(L.who, L.e);
    $('#dWho').textContent = L.who === 'boss' ? G.boss : P.name;
    if (L.who === 'boss') $('#dPor').src = portraitURL('hibari', L.e);
    const text = L.t.replace(/\{name\}/g, G.name).replace(/\{boss\}/g, G.boss);
    this.full = text; this.n = 0; this.typing = true;
    $('#dCh').innerHTML = ''; $('#dNx').style.display = 'none';
    clearInterval(this.tm);
    this.tm = setInterval(() => {
      this.n += 2;
      $('#dTxt').textContent = this.full.slice(0, this.n);
      if (this.n % 6 === 0) Sound.se('talk');
      if (this.n >= this.full.length) this.finishType();
    }, 30);
  },
  finishType() {
    clearInterval(this.tm); this.typing = false; $('#dTxt').textContent = this.full;
    const L = this.lines[this.i];
    if (L.ch) {
      $('#dCh').innerHTML = L.ch.map((c, k) => `<button class="pbtn sm ${k === 0 ? 'blue' : ''}" data-k="${k}">${c.t}</button>`).join('');
      $('#dCh').onclick = e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); const c = L.ch[+b.dataset.k]; if (c.f) c.f(); this.advance(); };
    } else $('#dNx').style.display = '';
  },
  click() {
    if (!this.active) return;
    if (this.typing) { this.finishType(); return; }
    if (this.lines[this.i].ch) return;
    this.advance();
  },
  advance() {
    Sound.se('click');
    this.i++;
    if (this.i >= this.lines.length) {
      this.active = false; $('#dialog').classList.add('hidden'); Game.dialogPause = false;
      const f = this.onDone; this.onDone = null; if (f) f();
      if (this.q.length) { const [l, d] = this.q.shift(); this.show(l, d); }
      return;
    }
    this.render();
  }
};

const Story = {
  unseenDone: 0, lastObjDone: {},
  chapter() { return CHAPTERS[G.story.ch] || null; },
  objDone(o) { try { return !!o.c(); } catch (e) { return false; } },
  start() {
    if (G.free) { $('#mission').classList.add('hidden'); return; }
    const ch = this.chapter();
    if (ch && !G.story.started) { G.story.started = true; Dialog.show(ch.start); }
    this.renderTracker();
  },
  check() {
    if (G.free) return;
    const ch = this.chapter(); if (!ch) return;
    let all = true;
    ch.obj.forEach((o, i) => {
      const ok = this.objDone(o);
      const key = G.story.ch + ':' + i;
      if (ok && !G.story.done[key]) { G.story.done[key] = 1; this.unseenDone++; toast('目標クリア：' + o.t.replace(/（.*）/, ''), 'gold', 'check'); Sound.se('coin'); }
      if (!ok) all = false;
    });
    this.renderTracker();
    if (all && !this.busy) {
      this.busy = true;
      const reward = ch.reward;
      const after = () => {
        if (reward && !G.free) { earn(reward, 'other'); toast(`ごほうび ${fmtYen(reward)}！`, 'gold', 'money'); Sound.se('money'); }
        G.story.ch++; G.story.started = false; this.busy = false;
        const nx = this.chapter();
        if (nx) setTimeout(() => { G.story.started = true; Dialog.show([{ who: 'hibari', t: `第${G.story.ch + 1}章「${nx.title}」のはじまりです！`, e: 'h' }].concat(nx.start)); this.renderTracker(); }, 800);
        else this.renderTracker();
      };
      if (G.story.ch === CHAPTERS.length - 1) { this.ending(after); }
      else { Sound.se('levelup'); Dialog.show([{ who: 'hibari', t: `第${G.story.ch + 1}章「${ch.title}」クリア！`, e: 'h' }].concat(ch.end), after); }
    }
  },
  renderTracker() {
    const box = $('#mission');
    if (G.free || UI.photo) { box.classList.add('hidden'); return; }
    const ch = this.chapter();
    if (!ch) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    if (!this.minInit) { this.minInit = true; if (window.innerWidth < 600) box.classList.add('min'); }
    let curShown = false;
    const html = `<h4>${iconImg('mission', 's')}第${G.story.ch + 1}章 ${ch.title}</h4><div class="obs">` + ch.obj.map((o, i) => {
      const ok = this.objDone(o);
      let cur = false, g = null;
      if (!ok && !curShown) { curShown = true; cur = true; g = tutorialStep(G.story.ch, i); }
      return `<div class="ob ${ok ? 'done' : ''} ${cur ? 'cur' : ''}"><span class="cb"></span><span>${o.t}${o.p && !ok ? ` <span class="sub">${o.p()}</span>` : ''}${g ? `<div class="gbtn"><button class="pbtn sm blue" data-g="show">▶ やり方</button>${g.kind === 'build' || g.kind === 'paint' ? '<button class="pbtn sm gold" data-g="auto">おまかせで置く</button>' : ''}</div>` : ''}</span></div>`;
    }).join('') + '</div>';
    if (box.innerHTML !== html) {
      box.innerHTML = html;
      box.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); Sound.init(); const g = currentTutorialStep(); if (!g) return; if (b.dataset.g === 'show') showGuide(g); else autoGuide(g); }));
    }
  },
  ending(after) {
    unlockAch('ending');
    Bus.emit('fireworks'); setTimeout(() => Bus.emit('fireworks'), 1500);
    Sound.bgm('ending');
    Dialog.show([
      { who: 'hibari', t: '宇宙行きのコスモライナー、無事に飛び立ちました…！', e: 'h' },
      { who: 'tsubasa', t: 'はじめてこの島に飛んできた日のこと、今でも覚えてます。あのときは草っぱらだったのに…！', e: 'h' },

      { who: 'mayor', t: '{boss}くん。この島に来てくれて、本当にありがとう。', e: 'h' },
      { who: 'jii', t: 'ふぉっふぉっ。空はどこまでもつながっておる。これからも、この「そらのみなと」をたのんだぞ。', e: 'h' },
      { who: 'soramaru', t: 'ソラまる〜！（ありがとう、空港長！）', e: 'h' },

function tutorialStep(ch, i) {
  if (ch !== 0) return ch === 1 ? tutorialStep1(i) : null;
  const X = x => x + OX, Y = y => y + OY;
  const anyKind = k => Object.values(G.blds).some(b => B[b.id].kind === k);
  const termTiles = () => { let n = 0; for (let i2 = 0; i2 < W * H; i2++) if (G.floor[i2] === FLOOR.TERM) n++; return n; };
  switch (i) {
    case 0: return { kind: 'build', id: 'runway_s', x: X(27), y: Y(32), rot: 0, say: '滑走路は飛行機が降りたり飛び立ったりする道。青く光っている場所に置いてみよう！（Rキーや「回転」で向きを変えられます）' };
    case 1: return { kind: 'build', id: 'tower', x: X(40), y: Y(27), rot: 0, say: '管制塔は飛行機に指示を出す場所。これがないと飛行機は来られないよ。' };

      if (old.ter[i0] !== TER.WATER || f0[i0]) { G.ter[i] = old.ter[i0] === TER.WATER ? TER.GRASS : old.ter[i0]; G.trees[i] = t0[i0]; }

// ---------- 研究・建物の効果（ほかのファイルから呼ばれる） ----------
const Extra = {
  turnMul() { let k = 1; if (hasKind('gse')) k *= 0.9; if (G.research.turnfast) k *= 0.9; return k; },
  gapMul() { return G.research.cdm ? 0.85 : 1; },
  holdLimit() { return G.research.sms ? 140 : 100; },
  priceMul(b, p) {
    const def = B[b.id]; let k = 1;
    if (G.research.signage && def.cat === 'shop') k *= 1.05;
    if (G.research.localfood && def.cat === 'food') k *= 1.1;
    if (G.research.nightshop && (G.min % 1440) >= 20 * 60) k *= 1.3;
    if (G.flags.event === 'valentine' && ['sweets', 'crepe', 'donut', 'icecream'].includes(b.id)) k *= 1.6;
    return k;
  },
  moodStart(p) {
    let m = 0;
    if (G.research.wifi6) m += 3;
    if (G.research.barrierfree && (p.type === 'elder' || p.type === 'babyc')) m += 6;
    if (G.research.kidsfriendly && (p.type === 'kid' || p.type === 'family' || p.type === 'babyc')) m += 5;
    return m;
  },
  visitorMul() { let k = 1; if (G.research.tourism) k *= 1.3; for (const b of Object.values(G.blds)) if (b.id === 'outlet' || b.id === 'museum' || b.id === 'ferris') k += 0.15; return k; },
  cargoMul() { return G.research.cargoauto ? 1.25 : 1; },
  upkeepMul() { return G.research.hydrogen ? 0.9 : 1; },
  ratingAdd() { return (G.research.carbon ? 0.1 : 0); },
  accessMul(b) { return G.research.maglev && (b.id === 'station' || b.id === 'monorail') ? 2 : 1; },
  daily() {
    if (hasKind('training')) { G.dev = (G.dev || 0) + 8; for (const a of Object.values(G.airlines)) a.rel = Math.min(100, a.rel + 0.3); }
  },
  onLanded(fl) {
    if (!fl.cargo && hasKind('catering')) earn(PLANES[fl.type].seats * 90, 'svc');
  },
  extraPax(fl) {
    if (G.flags.athlete && Math.random() < 0.15) return 'athlete';
    if (G.flags.idol && Math.random() < 0.02) return 'idol';
    if (G.flags.diplomat && Math.random() < 0.05) return 'diplomat';
    if (G.flags.bizBoost && Math.random() < 0.25) return 'biz';
    return null;
  },
};

// 接地のタイヤスモーク
Bus.on('touchdown', pl => {
  const s = Math.sin(pl.hdg), c = Math.cos(pl.hdg), L = pl.P.len;
  for (const sx of [-1, 1]) {
    const lx = sx * 0.3, lz = -L * 0.05;
    burst(pl.x + c * lx + s * lz, 0.08, pl.z - s * lx + c * lz, '#e8e8ec', 14, 0.6, 1.4, -0.2);
  }
});
// 飛行機雲
function contrail(pl) {
  if (pl.y < 9 || pl.P.eng === 'prop' || Math.random() > 0.7) return;
  const s = Math.sin(pl.hdg), c = Math.cos(pl.hdg), L = pl.P.len, xs = pl.P.engines === 4 ? [-0.7, -0.35, 0.35, 0.7] : [-0.4, 0.4];
  for (const f of xs) { const lx = f * pl.P.span * 0.5, lz = -L * 0.2; burst(pl.x + c * lx + s * lz, pl.y, pl.z - s * lx + c * lz, '#ffffff', 1, 0.05, 5, -0.02); }
}

const FX = { pts: null, n: 0, max: 3000, life: null, vel: null, show: [] };
function initFX() {

  Bus.on('fireworks', () => { FX.fwT = 22; });

}
function burst(x, y, z, color, n, spd, life, grav) {
  const pos = FX.pts.geometry.attributes.position.array, col = FX.pts.geometry.attributes.color.array;
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++) {
    let i = -1;
    for (let j = 0; j < FX.max; j++) { const q = (FX.cur = ((FX.cur || 0) + 1) % FX.max); if (FX.life[q] <= 0) { i = q; break; } }
    if (i < 0) return;
    const th = Math.random() * TAU, ph = Math.acos(Math.random() * 2 - 1), s = spd * (0.6 + Math.random() * 0.4);
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    FX.vel[i * 3] = Math.sin(ph) * Math.cos(th) * s; FX.vel[i * 3 + 1] = Math.cos(ph) * s; FX.vel[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * s;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    FX.life[i] = life * (0.7 + Math.random() * 0.5);
    FX.gr[i] = grav == null ? 3 : grav;
  }
  FX.pts.geometry.attributes.color.needsUpdate = true;
}
function updateFX(dt) {
  if (!FX.pts) return;
  if (FX.fwT > 0) {
    FX.fwT -= dt;
    if (Math.random() < dt * 2.2) {
      const x = Cam.tx + rnd(-14, 14), z = Cam.tz + rnd(-14, 4), y = rnd(9, 14);
      const cs = ['#ff6080', '#ffd84a', '#60d0ff', '#a0ff80', '#ff9040', '#e080ff', '#ffffff'];
      burst(x, y, z, pick(cs), 90, 4.5, 2.2, 3); burst(x, y, z, pick(cs), 30, 2.2, 2.6, 3);
      Sound.se('firework');
    }
  }
  const pos = FX.pts.geometry.attributes.position.array, col = FX.pts.geometry.attributes.color.array;
  let any = false;
  for (let i = 0; i < FX.max; i++) {
    if (FX.life[i] <= 0) continue;
    any = true;
    FX.life[i] -= dt;
    FX.vel[i * 3 + 1] -= FX.gr[i] * dt;
    FX.vel[i * 3] *= 0.985; FX.vel[i * 3 + 2] *= 0.985;
    pos[i * 3] += FX.vel[i * 3] * dt; pos[i * 3 + 1] += FX.vel[i * 3 + 1] * dt; pos[i * 3 + 2] += FX.vel[i * 3 + 2] * dt;
    if (FX.life[i] <= 0) pos[i * 3 + 1] = -100;
  }
  FX.pts.geometry.attributes.position.needsUpdate = true;
  FX.pts.visible = any;
  // 航空ショー
  for (const s of FX.show) {
    s.t += dt;
    const k = s.t / s.dur;
    s.planes.forEach((m, i) => {
      const off = (i - 1) * 1.6, lag = Math.abs(i - 1) * 1.2;
      const x = lerp(s.x0, s.x1, k) - lag * s.dx, z = lerp(s.z0, s.z1, k) + off * s.dz - lag * s.dzz;
      const y = 7 + Math.sin(k * TAU) * 1.5;
      m.position.set(x, y, z); m.rotation.y = s.hdg; m.rotation.z = Math.sin(k * TAU * 2) * 0.3 * (i - 1);
      if (Math.random() < 0.6) burst(x - Math.sin(s.hdg) * 1.2, y, z - Math.cos(s.hdg) * 1.2, ['#ff6080', '#ffffff', '#60a0ff'][i], 2, 0.2, 2.5, -0.1);
    });
    if (s.t >= s.dur) { s.planes.forEach(m => R.scene.remove(m)); s.done = true; }
  }
  FX.show = FX.show.filter(s => !s.done);
}

function clearRuntime() {
  for (const pl of RT.planes) removePlane(pl);
  RT.planes = []; RT.persons = []; RT.todayFlights = [];
  People.fac.clear();
  clearAmbient(); clearExtras(); if (typeof clearGuide === 'function') clearGuide();
  RT.fieldCache.clear(); RT.planePathCache.clear();
  RT.warnings = new Map(); RT.lastDay = null; RT.dirtyWalk = RT.dirtyAir = RT.dirtyBeauty = RT.dirtyCombo = RT.dirtyLinks = true;
  hideInfo(); setTool(null);
  resetWorldMeshes();
}
function startGame(slot, opt) {
  Game.slot = slot;
  clearRuntime();
  if (opt) {
    newGameState(opt);
    Cam.tx = 36 + OX; Cam.tz = 20 + OY; Cam.zoom = 1.5; Cam.rot = 0; Cam.yaw = Cam.yawT = Math.PI / 4;
  } else if (!loadSlot(slot)) { toast('データがありません', 'bad'); showTitle(); return; }
  initWorldMeshes();

  Game.demo = false; Game.started = true;
  $('#title').classList.add('hidden');

  Sound.bgm('day');
}

// ---------- 夜をとばす ----------
function canSkipNight() {
  const [ws, we] = opsWindow(), m = G.min % 1440;
  return !RT.planes.length && (m < ws - 60 || m > we + 20);
}
function skipNight(manual) {
  if (!canSkipNight()) { if (manual) toast('飛行機が飛んでいるので、いまはとばせません', 'bad'); return; }
  const [ws] = opsWindow();
  const startDay = G.day;
  let n = 0;
  // 朝（始発の1時間前）まで一気に進める
  while (n++ < 3000) {
    simStep(1);
    const m = G.min % 1440;
    if (RT.planes.length) break;
    if (G.day !== startDay || m < ws) { if (m >= ws - 60 && m < ws + 600) break; }
  }
  RT.persons = RT.persons.filter(p => p.kind !== 'visit' || p.state !== 'idle');
  Sound.se('chime2');
  toast(`夜をとばしました（${fmtTime(G.min)}）`, '', 'moon');
}
// ---------- メインループ ----------
function loop(now) {
  requestAnimationFrame(loop);
  let dtReal = Math.min(0.1, (now - Game.last) / 1000);
  Game.last = now;
  RT.time += dtReal;
  // シミュレーション
  let spd = Game.demo ? 1.5 : Game.speed;
  if (Game.modalPause || Game.dialogPause) spd = 0;
  const hr = (G.min % 1440) / 60;
  const [ws, we] = opsWindow();
  const quiet = !RT.planes.length && RT.persons.filter(p => p.w > 0).length < 4;
  const nightNow = hr * 60 < ws - 60 || hr * 60 > we + 20;
  if (!Game.demo && spd > 0 && Game.opts.nightSkip && quiet && nightNow) { skipNight(); spd = 0; }
  RT.effSpeed = spd;
  if (spd > 0) {
    let dt = dtReal / REAL_SEC_PER_GMIN * spd;
    while (dt > 0) { const s = Math.min(dt, 0.5); simStep(s); dt -= s; }
  }
  // 描画の準備
  keyPan(dtReal);
  if (!Game.demo) { applyInertia(dtReal); updateFollow(); updateTouchConfirm(); updateGuide(); }
  if (Game.demo) { Cam.yawT += dtReal * 0.03; }
  updateCamera();
  const d = dateOf(G.day);
  updateLighting(G.min % 1440, G.weather, d.season, dtReal);
  World.glassMat && (World.glassMat.uniforms.night.value = clamp(RT.nightF * 1.3, 0, 1));
  World.lightMat && (World.lightMat.opacity = clamp(RT.nightF * 1.2, 0, 1) * 0.28);
  updateWorldMeshes();
  updateAmbient(spd > 0 ? dtReal / REAL_SEC_PER_GMIN * Math.min(spd, 4) : 0, dtReal);
  renderPeople(dtReal);
  updateFX(dtReal);
  if (!Game.demo || true) updateExtras(spd > 0 ? dtReal / REAL_SEC_PER_GMIN * Math.min(spd, 4) : 0, dtReal);
  if (Cam.shake > 0) Cam.shake = Math.max(0, Cam.shake - dtReal);
  renderFrame();
  // UI
  if (!Game.demo) {
    updateHUD();
    UI.infoT -= dtReal; if (UI.infoT <= 0 && UI.sel) { UI.infoT = 0.5; renderInfo(); }
    if (UI.landLbl) updateLandLabels();
    Game.hintT -= dtReal; if (Game.hintT <= 0) { Game.hintT = 3; checkHints(); }
    const ns = $('#bNight'); if (ns) ns.classList.toggle('hidden', !canSkipNight());
    if (UI.modalOpen === 'board') { Game.boardT = (Game.boardT || 0) - dtReal; if (Game.boardT <= 0) { Game.boardT = 2; const st = $('#mBody').scrollTop; openBoard(); $('#mBody').scrollTop = st; } }
  }
  // BGM
  Game.bgmT -= dtReal;
  if (Game.bgmT <= 0 && Sound.ctx) {
    Game.bgmT = 3;
    if (Game.demo) Sound.bgm('title');
    else if (Sound.cur !== 'ending' && Sound.cur !== 'space') {
      const ev = eventDef();
      if (ev && (ev.visitors || 0) >= 2 && RT.nightF < 0.9) Sound.bgm('event');
      else if (RT.nightF > 0.6) Sound.bgm('night');
      else Sound.bgm(G.day % 2 ? 'day2' : 'day');
    } else if (Sound.cur === 'space' && !RT.planes.some(p => p.fl.type === 'cosmo')) { Game.spaceT = (Game.spaceT || 0) + 3; if (Game.spaceT > 60) { Game.spaceT = 0; Sound.bgm('day'); } }
  }
}
